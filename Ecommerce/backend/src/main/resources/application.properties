# ==============================================================================
# ShopEase Spring Boot Backend Configuration (MySQL Primary Database)
# ==============================================================================

server.port=5000
spring.application.name=shopease-backend

# Jackson JSON Serialization
spring.jackson.serialization.write-dates-as-timestamps=false
spring.jackson.default-property-inclusion=non_null
spring.jackson.property-naming-strategy=SNAKE_CASE

# Multipart Uploads (for product image uploads)
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=20MB

# File Upload Storage Path
file.upload-dir=uploads

# JWT Security
jwt.secret=shopease_super_secret_jwt_key_2026_modern_ecommerce_very_secure_and_long_enough_for_hmac256
jwt.expiration-ms=2592000000

# ==============================================================================
# MySQL 8.0 Database Configuration (Primary Database Engine)
# ==============================================================================
spring.datasource.url=jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/${DB_NAME:shopease_db}?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
spring.datasource.username=${DB_USER:root}
spring.datasource.password=${DB_PASSWORD:Ramki@123}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false

# HikariCP Enterprise Connection Pool
spring.datasource.hikari.maximum-pool-size=20
spring.datasource.hikari.minimum-idle=5
spring.datasource.hikari.idle-timeout=300000
spring.datasource.hikari.connection-timeout=20000
spring.datasource.hikari.max-lifetime=1200000

# Swagger OpenAPI Docs
springdoc.api-docs.path=/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.operationsSorter=method
